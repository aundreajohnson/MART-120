<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  </head>
  <body>
    <script>
      let headSize = 100;
      let grow = 1;

      let x = 250;
      let y = 200;
      let xSpeed = 2;
      let ySpeed = 2;
      let headColor;

      let nameX = 300;
      let nameY = 500;
      let move = "right";

      function setup() {
        createCanvas(500, 600);
        headColor = color(random(255), random(255), random(255));
        textAlign(CENTER);
      }

      function draw() {
        background(220);

        // head grows and shrinks
        fill(headColor);
        circle(x, y, headSize);
        headSize += grow;
        if (headSize > 120 || headSize < 80) {
          grow *= -1;
        }

        // move shape and bounce off walls, change color
        x += xSpeed;
        y += ySpeed;
        if (x > width - 50 || x < 50) {
          xSpeed *= -1;
          headColor = color(random(255), random(255), random(255));
        }
        if (y > height - 300 || y < 100) {
          ySpeed *= -1;
          headColor = color(random(255), random(255), random(255));
        }

        // move name in a square
        fill(0);
        textSize(24);
        text("Your Name", nameX, nameY);

        if (move === "right") {
          nameX += 2;
          if (nameX > 400) move = "up";
        } else if (move === "up") {
          nameY -= 2;
          if (nameY < 400) move = "left";
        } else if (move === "left") {
          nameX -= 2;
          if (nameX < 200) move = "down";
        } else if (move === "down") {
          nameY += 2;
          if (nameY > 500) move = "right";
        }
      }
    </script>
  </body>
</html>
